# Per-instance Core Lightning: CLN_NAME is substituted per instance
# before apply. Connects to the environment's one bitcoind over the
# JSON-RPC via the bcli plugin; no ZMQ and no wallet init or unlock —
# CLN generates its hsm_secret on first boot.
# --network=signet: CLN's chainparams carry no signet challenge and it
# validates nothing itself — it delegates consensus to bitcoind and
# only pins the default signet genesis hash, which custom-challenge
# envs share. BOLT p2p has no network magic, so per-env chains need no
# CLN-side derivation either; the api meshes sibling instances over
# exec instead.
# clnrest serves the REST surface: HTTPS with orchestrator-provisioned
# certs (secret cln-CLN_NAME-tls, mounted into the clnrest-certs dir —
# clnrest skips its own generation when all six files exist), auth via
# a commando rune header. cln-grpc stays disabled (its grpc-port
# option is never set): its mutual-TLS client cert+key credential does
# not fit the connection bundle, and REST proxies the full JSON-RPC.
# StatefulSet, not Deployment: the orchestrator execs into the pod by
# its stable name (cln-CLN_NAME-0); a Deployment's hashed pod names
# would not match.
apiVersion: v1
kind: Service
metadata:
  name: cln-CLN_NAME
spec:
  selector:
    app: cln-CLN_NAME
  ports:
    - name: rest
      port: 7572
      targetPort: 7572
    - name: p2p
      port: 9735
      targetPort: 9735
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cln-CLN_NAME
spec:
  serviceName: cln-CLN_NAME
  replicas: 1
  selector:
    matchLabels:
      app: cln-CLN_NAME
  template:
    metadata:
      labels:
        app: cln-CLN_NAME
    spec:
      containers:
        - name: cln
          image: elementsproject/lightningd:v26.06.10
          # The image entrypoint runs `lightningd --network=$LIGHTNINGD_NETWORK`
          # with these args; k8s expands $(VAR) from the container env.
          args:
            - --bitcoin-rpcconnect=bitcoind
            - --bitcoin-rpcport=38332
            - --bitcoin-rpcuser=$(BITCOIN_RPC_USER)
            - --bitcoin-rpcpassword=$(BITCOIN_RPC_PASSWORD)
            # v26 removed --port, and autolisten binds the NETWORK default
            # (signet: 39735). Pin 9735 so the Service, containerPort, and
            # mesh targets stay identical across implementations.
            - --bind-addr=0.0.0.0:9735
            - --clnrest-port=7572
            - --clnrest-host=0.0.0.0
            - --clnrest-protocol=https
            - --clnrest-certs=/root/.lightning/rest-tls
          env:
            - name: LIGHTNINGD_NETWORK
              value: signet
            - name: BITCOIN_RPC_USER
              valueFrom:
                secretKeyRef:
                  name: signet-secrets
                  key: BITCOIN_RPC_USER
            - name: BITCOIN_RPC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: signet-secrets
                  key: BITCOIN_RPC_PASSWORD
          ports:
            - name: rest
              containerPort: 7572
            - name: p2p
              containerPort: 9735
          volumeMounts:
            - name: data
              mountPath: /root/.lightning
            - name: rest-tls
              mountPath: /root/.lightning/rest-tls
              readOnly: true
      volumes:
        - name: rest-tls
          secret:
            secretName: cln-CLN_NAME-tls
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
