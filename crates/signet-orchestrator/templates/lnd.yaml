# Per-instance LND: LND_NAME is substituted per instance
# before apply. Connects to the environment's one bitcoind over RPC + ZMQ.
# First boot creates the wallet (--noseedbackup: env wallets are disposable);
# later boots unlock it. The admin macaroon is read by the api via exec.
# TLS is orchestrator-provisioned (secret lnd-LND_NAME-tls): LND's
# autogenerated cert is CA:TRUE, which strict clients (rustls/webpki)
# reject in the leaf position. StatefulSet, not Deployment: the
# orchestrator execs into the pod by its stable name (lnd-LND_NAME-0); a
# Deployment's hashed pod names would not match.
apiVersion: v1
kind: Service
metadata:
  name: lnd-LND_NAME
spec:
  selector:
    app: lnd-LND_NAME
  ports:
    - name: rest
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 10009
      targetPort: 10009
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lnd-LND_NAME
spec:
  serviceName: lnd-LND_NAME
  replicas: 1
  selector:
    matchLabels:
      app: lnd-LND_NAME
  template:
    metadata:
      labels:
        app: lnd-LND_NAME
    spec:
      containers:
        - name: lnd
          image: lightninglabs/lnd:v0.21.4-beta
          command: ["/bin/sh", "-c"]
          args:
            - |
              # lnd runs in the foreground; the orchestrator initializes or
              # unlocks the wallet over an exec'd tty once the RPC server
              # is up (lncli masks passwords through the terminal, so the
              # init cannot be piped from a shell script). TLS material
              # comes from the lnd-LND_NAME-tls secret; with both files
              # present lnd never autogenerates a cert.
              exec lnd \
                --noseedbackup \
                --bitcoin.signet \
                --bitcoin.node=bitcoind \
                --bitcoind.rpchost=bitcoind:38332 \
                --bitcoind.rpcuser=$BITCOIN_RPC_USER \
                --bitcoind.rpcpass=$BITCOIN_RPC_PASSWORD \
                --bitcoind.zmqpubrawblock=tcp://bitcoind:28332 \
                --bitcoind.zmqpubrawtx=tcp://bitcoind:28333 \
                --rpclisten=0.0.0.0:10009 \
                --restlisten=0.0.0.0:8080 \
                --tlscertpath=/root/.lnd/tls/tls.crt \
                --tlskeypath=/root/.lnd/tls/tls.key
          env:
            - name: BITCOIN_RPC_USER
              valueFrom:
                secretKeyRef:
                  name: signet-secrets
                  key: BITCOIN_RPC_USER
            - name: BITCOIN_RPC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: signet-secrets
                  key: BITCOIN_RPC_PASSWORD
            - name: LND_WALLET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: signet-secrets
                  key: LND_WALLET_PASSWORD
          ports:
            - name: rest
              containerPort: 8080
            - name: grpc
              containerPort: 10009
            - name: p2p
              containerPort: 9735
          volumeMounts:
            - name: data
              mountPath: /root/.lnd
            - name: tls
              mountPath: /root/.lnd/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: lnd-LND_NAME-tls
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
