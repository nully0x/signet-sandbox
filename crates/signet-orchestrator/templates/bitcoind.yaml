apiVersion: v1
kind: ConfigMap
metadata:
  name: bitcoind-config
data:
  base.conf: |
    signet=1
    txindex=1
    server=1
    fallbackfee=0.00001
    maxconnections=16
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bitcoind
spec:
  serviceName: bitcoind
  replicas: 1
  selector:
    matchLabels:
      app: bitcoind
  template:
    metadata:
      labels:
        app: bitcoind
    spec:
      initContainers:
        - name: init-config
          image: bitcoin/bitcoin:29.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cp /etc/bitcoin/base.conf /bitcoin/bitcoin.conf
              echo "signetchallenge=$SIGNET_CHALLENGE" >> /bitcoin/bitcoin.conf
              echo "" >> /bitcoin/bitcoin.conf
              echo "[signet]" >> /bitcoin/bitcoin.conf
              echo "rpcbind=0.0.0.0" >> /bitcoin/bitcoin.conf
              echo "rpcallowip=0.0.0.0/0" >> /bitcoin/bitcoin.conf
              echo "rpcuser=$BITCOIN_RPC_USER" >> /bitcoin/bitcoin.conf
              echo "rpcpassword=$BITCOIN_RPC_PASSWORD" >> /bitcoin/bitcoin.conf
          env:
            - name: SIGNET_CHALLENGE
              valueFrom:
                secretKeyRef:
                  name: signet-secrets
                  key: SIGNET_CHALLENGE
            - name: BITCOIN_RPC_USER
              valueFrom:
                secretKeyRef:
                  name: signet-secrets
                  key: BITCOIN_RPC_USER
            - name: BITCOIN_RPC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: signet-secrets
                  key: BITCOIN_RPC_PASSWORD
          volumeMounts:
            - name: config
              mountPath: /etc/bitcoin
            - name: data
              mountPath: /bitcoin
      containers:
        - name: bitcoind
          image: bitcoin/bitcoin:29.4
          env:
            - name: BITCOIN_DATA
              value: /bitcoin
          ports:
            - name: rpc
              containerPort: 38332
            - name: p2p
              containerPort: 38333
          volumeMounts:
            - name: data
              mountPath: /bitcoin
            - name: config
              mountPath: /etc/bitcoin
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  bitcoin-cli -datadir=/bitcoin -signet getblockchaininfo > /dev/null 2>&1
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: bitcoind-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bitcoind
spec:
  selector:
    app: bitcoind
  ports:
    - name: rpc
      port: 38332
      targetPort: 38332
    - name: p2p
      port: 38333
      targetPort: 38333
