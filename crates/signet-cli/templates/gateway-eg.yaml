# Edge bootstrap for the signet dev cluster: Envoy Gateway controller +
# GatewayClass + the shared platform Gateway. It serves env HTTP (explorer)
# routes for DNS env hosts; IP/localhost env hosts bypass it entirely and
# use per-env LoadBalancer ports (see the port pools in signet-orchestrator).
apiVersion: v1
kind: Namespace
metadata:
  name: signet-platform
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: signet-eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: signet-eg
  namespace: signet-platform
spec:
  gatewayClassName: signet-eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces: { from: All }
