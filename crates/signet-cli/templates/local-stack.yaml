# Local-mode platform stack: postgres + the provisioning API inside the
# developer's k3d cluster (spec §10.2). Local-only credentials; the API
# publishes on localhost:8081 through the k3d serverlb port mapping.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: signet-platform
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: signet-platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: signet-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          env:
            - { name: POSTGRES_USER, value: signet }
            - { name: POSTGRES_PASSWORD, value: signet }
            - { name: POSTGRES_DB, value: signet }
          ports:
            - { containerPort: 5432 }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "signet", "-d", "signet"] }
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            # Postgres 18+ keeps data in a versioned subdir; mount the parent.
            - { name: data, mountPath: /var/lib/postgresql }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: signet-api
  namespace: signet-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: signet-api-local
rules:
  # Local-only: single-user cluster, the API provisions everything.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: signet-api-local
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: signet-api-local
subjects:
  - kind: ServiceAccount
    name: signet-api
    namespace: signet-platform
---
apiVersion: v1
kind: Service
metadata:
  name: signet-api
  namespace: signet-platform
spec:
  type: LoadBalancer
  selector:
    app: signet-api
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signet-api
  namespace: signet-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signet-api
  template:
    metadata:
      labels:
        app: signet-api
    spec:
      serviceAccountName: signet-api
      containers:
        - name: api
          image: REGISTRY_PLACEHOLDER/signet-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - { name: DATABASE_URL, value: postgres://signet:signet@postgres:5432/signet }
            - { name: SIGNET_API_LISTEN, value: 0.0.0.0:8081 }
            - { name: SIGNET_API_PUBLIC_URL, value: http://localhost:8081 }
            - { name: SIGNET_ENV_HOST, value: http://localhost }
          ports:
            - { containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 3
            periodSeconds: 5
