# Builds the `signet` CLI for distribution and attaches the release
# archives to the GitHub release. scripts/install.sh and the site copy
# of it download from there. No windows build: the codebase is unix-only.
#
# Release paths:
#   tag push v*            release named after the tag
#   dispatch + version     release created at that version tag
#   dispatch, no version   artifacts only (smoke test)
name: publish-cli

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.1.0 or 0.1.0 (empty: build artifacts only)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The version flows into the asset name and must match what
      # scripts/install.sh looks up: a v-prefixed tag on release runs.
      - name: Resolve version
        id: meta
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ -n "$DISPATCH_VERSION" ]; then
            echo "version=$DISPATCH_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: cargo build --release -p signet-cli --target ${{ matrix.target }}

      - name: Package
        run: |
          name="signet-${{ steps.meta.outputs.version }}-${{ matrix.target }}"
          mkdir staging
          cp "target/${{ matrix.target }}/release/signet" staging/signet
          tar -czf "$name.tar.gz" -C staging signet
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            signet-*.tar.gz
            signet-*.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag' || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: |
          # Normalize to the v-prefixed tag the installer and docs use.
          VERSION="v${VERSION#v}"
          gh release view "$VERSION" >/dev/null 2>&1 \
            || gh release create "$VERSION" --title "signet $VERSION" --generate-notes
          gh release upload "$VERSION" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
